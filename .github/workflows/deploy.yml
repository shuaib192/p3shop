name: 🚀 Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 89.117.8.98
          username: u257472397
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          script: |
            # Navigate to deployment directory
            cd ~/public_html/shop

            # Backup production db.php (has Hostinger DB credentials)
            cp includes/db.php /tmp/db_production_backup.php

            # Pull latest code from GitHub
            git pull origin main

            # Restore production db.php (don't overwrite with local XAMPP credentials)
            cp /tmp/db_production_backup.php includes/db.php

            echo "✅ Deployment complete!"
